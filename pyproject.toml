[project]
name = "mi-ripple"
description = "Unofficial ComfyUI nodes for Mi-Ripple's local, deterministic diagnosis and repair of periodic lattice / granule artifacts (CPU, no network, no regeneration). Outcomes follow the official code; verified for 512x512 RGB."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["scikit-image>=0.24,<1", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/hiroki-abe-58/ComfyUI-MiRipple"

[tool.comfy]
PublisherId = "hiroki-abe-58"
DisplayName = "Mi-Ripple Local (unofficial)"
Icon = ""

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = ["miripple_comfy/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
